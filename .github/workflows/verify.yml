name: Verify

on:
  push:
    branches: [main, cli]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            pc/pc-gateway/package-lock.json
            pc/pc-gateway/ui/package-lock.json

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install locked Node.js dependencies
        run: |
          npm ci --prefix pc/pc-gateway --ignore-scripts --no-audit --no-fund
          npm ci --prefix pc/pc-gateway/ui --ignore-scripts --no-audit --no-fund

      - name: Prepare isolated ADB home for integration tests
        run: sudo install -d -m 700 /var/lib/agentcall/adb/.android

      - name: Verify integrated product
        run: ./verify.sh

      - name: Check repository whitespace
        run: git diff --check
